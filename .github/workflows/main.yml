name: 刷课
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # ✅ 新增：开启页面手动触发（关键）
  #schedule:
  #  - cron: "0 8 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v3

      - name: 设置python环境
        uses: actions/setup-python@v2
        with:
          python-version: "3.13"

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: Run main.py
        run: python main.py -u 1972759630 -p zf1103426 -l 261993892
